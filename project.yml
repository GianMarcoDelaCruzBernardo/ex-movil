name: BBVAApp
options:
  bundleIdPrefix: pe.tecsup.gian
  deploymentTarget:
    iOS: "17.0"
targets:
  BBVAApp:
    type: application
    platform: iOS
    sources: [BBVAApp]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: BBVA
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBlue
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.tecsup.gian.bbvaapp
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
